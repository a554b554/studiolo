<!doctype html>
<html lang="zh-CN" data-theme="system"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artifact · Studiolo</title><link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/styles.css"><script type="module" src="/open.js"></script></head>
<body class="open-page"><main class="open-status"><p id="open-status" class="muted"><span data-i18n="正在打开 Artifact…">正在打开 Artifact…</span></p><p id="open-error" class="run-error" role="alert" hidden></p><p id="open-actions" hidden><a id="open-edit" href="/"><span data-i18n="在编辑模式中打开">在编辑模式中打开</span></a></p></main><dialog id="auth-dialog"><div class="dialog-head"><h2><span data-i18n="连接 Studiolo">连接 Studiolo</span></h2></div><form id="auth-form" class="dialog-body"><label><span data-i18n="服务访问令牌">服务访问令牌</span><input id="auth-token" type="password" required autocomplete="current-password"></label><p id="auth-error" class="auth-error"></p><div class="dialog-actions"><button type="submit" class="primary"><span data-i18n="连接">连接</span></button></div></form></dialog><dialog id="device-dialog" data-persistent><div class="dialog-head"><h2><span data-i18n="此设备尚未获准访问">此设备尚未获准访问</span></h2></div><div class="dialog-body"><p class="small" data-i18n="这台设备第一次连接此 Studiolo。给它起个名字，然后在已获准的设备上打开「设置 → 设备」批准它，或在服务器本机运行下面的命令。">这台设备第一次连接此 Studiolo。给它起个名字，然后在已获准的设备上打开「设置 → 设备」批准它，或在服务器本机运行下面的命令。</p><label><span data-i18n="设备名称">设备名称</span><input id="device-name" maxlength="60" autocomplete="off"></label><p class="small muted"><span data-i18n="识别码">识别码</span> <code id="device-fingerprint"></code></p><pre class="device-command">node scripts/devices.mjs approve <span id="device-id"></span></pre><p id="device-status" class="small" role="status"></p></div></dialog></body></html>
