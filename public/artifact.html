<!doctype html>
<html lang="zh-CN" data-theme="brutal"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artifact · Studiolo</title><link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/styles.css"><script type="module" src="/artifact.js"></script></head>
<body class="artifact-page"><header class="topbar artifact-topbar"><a href="/" class="quiet" aria-label="返回工作台" data-i18n-aria-label="返回工作台"><span data-i18n="← 项目">← 项目</span></a><h1 id="artifact-title">Artifact</h1><span class="spacer"></span><span id="connection" class="connection">连接中</span><label><span><span data-i18n="外观">外观</span></span><select data-theme-picker aria-label="外观" data-i18n-aria-label="外观"></select></label><button id="settings-open" class="quiet"><span data-i18n="设置">设置</span></button></header><div id="notice" class="notice" role="alert" hidden></div>
<div class="artifact-toolbar"><button id="artifact-start"><span data-i18n="启动">启动</span></button><button id="artifact-stop" disabled><span data-i18n="停止">停止</span></button><button id="artifact-refresh" aria-label="刷新预览" data-i18n-aria-label="刷新预览">↻</button><button id="artifact-snapshots"><span data-i18n="数据快照">数据快照</span></button><span id="runtime-status" class="muted small">读取状态…</span><span id="persistence-status" class="muted small" role="status"></span><span class="spacer"></span><button id="select-mode" aria-pressed="false"><span data-i18n="选取内容">选取内容</span></button><button id="text-mode" aria-pressed="false"><span data-i18n="选取文字">选取文字</span></button><button id="area-mode" aria-pressed="false"><span data-i18n="框选区域">框选区域</span></button><button id="comments-toggle" aria-expanded="true"><span data-i18n="批注">批注</span></button></div>
<main class="artifact-layout"><section class="preview-wrap" aria-label="Artifact 预览" data-i18n-aria-label="Artifact 预览"><div id="remote-preview-note" class="remote-preview-note" hidden></div><div id="preview-empty" class="preview-empty"><p class="muted"><span data-i18n="启动 Artifact 后显示网页。">启动 Artifact 后显示网页。</span></p></div><iframe id="preview" title="Artifact 网页" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-pointer-lock allow-popups" allow="fullscreen" allowfullscreen referrerpolicy="same-origin" hidden data-i18n-title="Artifact 网页"></iframe></section>
<aside id="comments-panel" class="comments-panel" aria-label="Artifact 批注" data-i18n-aria-label="Artifact 批注"><header class="comments-head"><h2 id="comments-heading">批注</h2><select id="comment-filter" aria-label="筛选批注" data-i18n-aria-label="筛选批注"><option value="open" data-i18n="未解决">未解决</option><option value="all" data-i18n="全部">全部</option><option value="resolved" data-i18n="已解决">已解决</option><option value="orphaned" data-i18n="位置失效">位置失效</option></select></header><div id="comments-list" class="comments-list"></div><div class="comment-composer"><div id="artifact-queue" class="queue" hidden></div><div class="selection-status"><span id="selection-label">先选取页面内容或直接填写批注</span><button id="selection-clear" class="quiet" hidden><span data-i18n="取消">取消</span></button></div><div id="selection-evidence" class="selection-evidence" hidden></div><form id="comment-form"><textarea id="comment-text" placeholder="输入批注…" aria-label="批注内容" required data-i18n-aria-label="批注内容"></textarea><div class="composer-controls"><select id="profile" aria-label="Agent"></select><select id="model" aria-label="模型" data-i18n-aria-label="模型"></select><select id="effort" aria-label="Reasoning effort"></select><select id="host" aria-label="执行电脑" data-i18n-aria-label="执行电脑"></select><select id="permission" aria-label="执行权限" data-i18n-aria-label="执行权限"><option value="auto">Auto</option><option value="default" data-i18n="沿用 CLI 权限">沿用 CLI 权限</option><option value="read-only" data-i18n="只读">只读</option><option value="project-write" data-i18n="允许修改项目">允许修改项目</option></select><button class="primary send" id="comment-send" type="submit"><span data-i18n="发送 ↑">发送 ↑</span></button></div></form></div></aside></main>
<dialog id="snapshot-dialog"><div class="dialog-head"><h2><span data-i18n="持久数据快照">持久数据快照</span></h2><button class="quiet" data-close aria-label="关闭" data-i18n-aria-label="关闭">×</button></div><div class="dialog-body"><p class="small muted"><span data-i18n="快照用于将已保存的数据迁移或恢复；恢复前需停止 Artifact。">快照用于将已保存的数据迁移或恢复；恢复前需停止 Artifact。</span></p><button id="snapshot-create" class="primary"><span data-i18n="创建快照">创建快照</span></button><ul id="snapshot-list" class="snapshot-list"></ul><form id="snapshot-restore"><label><span data-i18n="快照 ID">快照 ID</span><input name="snapshotId" required placeholder="输入已有快照 ID" data-i18n-placeholder="输入已有快照 ID"></label><div class="dialog-actions"><button type="submit"><span data-i18n="恢复快照">恢复快照</span></button></div></form></div></dialog>
<dialog id="auth-dialog"><div class="dialog-head"><h2><span data-i18n="连接 Studiolo">连接 Studiolo</span></h2></div><form id="auth-form" class="dialog-body"><label><span data-i18n="服务访问令牌">服务访问令牌</span><input id="auth-token" type="password" required autocomplete="current-password"></label><p id="auth-error" class="auth-error"></p><div class="dialog-actions"><button type="submit" class="primary"><span data-i18n="连接">连接</span></button></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-head"><h2 data-i18n="设置">设置</h2><button class="quiet" data-close aria-label="关闭" data-i18n-aria-label="关闭">×</button></div><div class="dialog-body"><label><span data-i18n="界面语言">界面语言</span><select data-language-picker aria-label="界面语言" data-i18n-aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select><small data-i18n="仅影响平台界面，不改变会话或 Artifact 内容。">仅影响平台界面，不改变会话或 Artifact 内容。</small></label></div></dialog>
</body></html>
