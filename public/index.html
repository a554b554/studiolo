<!doctype html>
<html lang="zh-CN" data-theme="brutal">
<head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studiolo</title><link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="topbar"><span class="brand">studiolo.</span><span class="spacer"></span><span id="connection" class="connection">连接中</span><label><span><span data-i18n="外观">外观</span></span><select data-theme-picker aria-label="外观" data-i18n-aria-label="外观"></select></label><button id="settings-open" class="quiet"><span data-i18n="设置">设置</span></button></header>
<div id="notice" class="notice" role="alert" hidden></div>
<main class="workspace" id="workspace">
<aside class="sidebar" aria-label="项目与会话" data-i18n-aria-label="项目与会话"><div class="pane-head"><h2><span data-i18n="项目">项目</span></h2><button class="quiet mobile-only" data-close-drawer aria-label="关闭项目栏" data-i18n-aria-label="关闭项目栏">×</button></div><div class="sidebar-actions"><button class="primary" id="project-new"><span data-i18n="＋ 新建项目">＋ 新建项目</span></button></div><nav class="project-list" id="project-list"></nav><section id="account-usage" class="account-usage" aria-label="Usage"></section><div class="sidebar-foot" id="machine-label"></div></aside>
<section class="conversation" aria-label="聊天" data-i18n-aria-label="聊天"><header class="conversation-head"><button class="mobile-only quiet" data-drawer="projects" aria-label="打开项目栏" data-i18n-aria-label="打开项目栏">☰</button><div class="title-block"><h1 id="session-title">选择项目</h1><p id="project-title"></p></div><button id="takeover" class="quiet" hidden><span data-i18n="在本机接管">在本机接管</span></button><button class="mobile-only quiet" data-drawer="files" aria-label="打开文件栏" data-i18n-aria-label="打开文件栏"><span data-i18n="文件">文件</span></button></header><div id="messages" class="messages" aria-live="polite"><p class="empty"><span data-i18n="正在读取项目…">正在读取项目…</span></p></div><footer class="composer-wrap"><div id="queue" class="queue" hidden></div><form class="composer" id="composer"><textarea id="prompt" aria-label="消息" placeholder="输入消息…" rows="2" disabled data-i18n-aria-label="消息"></textarea><div id="attachments" class="attachments" aria-label="附件" data-i18n-aria-label="附件" hidden></div><div class="composer-controls"><button type="button" class="quiet attach" id="attach" aria-label="添加附件" title="添加附件" data-i18n-aria-label="添加附件" data-i18n-title="添加附件" disabled>📎</button><input type="file" id="attach-input" multiple hidden><select id="profile" aria-label="Agent"></select><select id="model" aria-label="模型" data-i18n-aria-label="模型"></select><select id="effort" aria-label="Reasoning effort"></select><select id="host" aria-label="执行电脑" data-i18n-aria-label="执行电脑"></select><select id="permission" aria-label="执行权限" data-i18n-aria-label="执行权限"><option value="auto">Auto</option><option value="default" data-i18n="沿用 CLI 权限">沿用 CLI 权限</option><option value="read-only" data-i18n="只读">只读</option><option value="project-write" data-i18n="允许修改项目">允许修改项目</option></select><button class="primary send" id="send" type="submit" disabled><span data-i18n="发送 ↑">发送 ↑</span></button></div></form><p class="compose-note"><span data-i18n="Ctrl / ⌘ + Enter 发送 · 每个会话独立排队 · 拖放文件即可作为附件上传">Ctrl / ⌘ + Enter 发送 · 每个会话独立排队 · 拖放文件即可作为附件上传</span></p></footer><div class="drop-hint" aria-hidden="true"><span data-i18n="松开以作为本次消息的附件上传">松开以作为本次消息的附件上传</span></div></section>
<aside class="explorer" aria-label="项目文件" data-i18n-aria-label="项目文件"><header class="pane-head"><h2><span data-i18n="项目资源">项目资源</span></h2><button class="quiet" id="files-refresh" aria-label="重新读取项目资源" title="重新读取项目资源" data-i18n-aria-label="重新读取项目资源" data-i18n-title="重新读取项目资源">↻</button><button class="quiet mobile-only" data-close-drawer aria-label="关闭文件栏" data-i18n-aria-label="关闭文件栏">×</button></header><div class="resource-tabs" role="tablist"><button role="tab" data-resource="files" aria-selected="true"><span data-i18n="文件">文件</span></button><button role="tab" data-resource="artifacts" aria-selected="false">Artifacts</button></div><div class="resources"><section id="files-section"><div class="files-actions"><button id="files-upload" class="quiet"><span data-i18n="＋ 上传文件">＋ 上传文件</span></button><input type="file" id="files-input" multiple hidden><span id="upload-status" class="upload-status muted"></span></div><div id="files" class="tree"></div></section><section id="artifacts" hidden><button id="artifact-new" class="quiet"><span data-i18n="＋ 注册 Artifact">＋ 注册 Artifact</span></button><div id="artifact-list"></div></section></div><div id="project-path" class="project-path">项目目录<code>—</code></div><div class="drop-hint" aria-hidden="true"><span data-i18n="松开以上传到项目 uploads 文件夹">松开以上传到项目 uploads 文件夹</span></div></aside><button class="drawer-backdrop" data-close-drawer aria-label="关闭侧栏" data-i18n-aria-label="关闭侧栏"></button>
</main>
<dialog id="project-dialog"><div class="dialog-head"><h2><span data-i18n="新建项目">新建项目</span></h2><button class="quiet" data-close aria-label="关闭" data-i18n-aria-label="关闭">×</button></div><form class="dialog-body" id="project-form"><label><span data-i18n="名称">名称</span><input name="name" required maxlength="120" autofocus></label><p class="small muted" data-i18n="项目内容和记录将自动保存在平台的 projects 文件夹中。">项目内容和记录将自动保存在平台的 projects 文件夹中。</p><div class="dialog-actions"><button class="primary" type="submit"><span data-i18n="创建项目">创建项目</span></button></div></form></dialog>


<dialog id="file-dialog" class="file-dialog"><div class="dialog-head"><button type="button" class="quiet" id="file-back" hidden aria-label="返回上一个文件" title="返回上一个文件" data-i18n-aria-label="返回上一个文件" data-i18n-title="返回上一个文件">←</button><h2 id="file-title"></h2><div id="file-view" class="view-toggle" role="group" aria-label="文件视图" data-i18n-aria-label="文件视图" hidden><button type="button" data-file-mode="rendered" aria-pressed="true"><span data-i18n="预览">预览</span></button><button type="button" data-file-mode="source" aria-pressed="false"><span data-i18n="源码">源码</span></button></div><button class="quiet" data-close aria-label="关闭文件" data-i18n-aria-label="关闭文件">×</button></div><p id="file-error" class="file-error" role="alert" hidden></p><div id="file-rendered" class="markdown markdown-doc file-rendered" hidden></div><pre id="file-source"><code id="file-content"></code></pre></dialog>
<dialog id="artifact-dialog"><div class="dialog-head"><h2><span data-i18n="注册 Artifact">注册 Artifact</span></h2><button class="quiet" data-close aria-label="关闭" data-i18n-aria-label="关闭">×</button></div><form id="artifact-form" class="dialog-body"><label><span data-i18n="名称">名称</span><input name="name" required></label><label><span data-i18n="项目内目录">项目内目录</span><input name="root" required placeholder="artifacts/my-app"></label><label><span data-i18n="入口文件">入口文件</span><input name="entry" required value="index.html"></label><label><span data-i18n="后端启动命令（可选）">后端启动命令（可选）</span><textarea name="command" rows="2" placeholder="[&quot;node&quot;, &quot;server.mjs&quot;]"></textarea><small><span data-i18n="JSON 参数数组；静态网页留空。">JSON 参数数组；静态网页留空。</span></small></label><label><span data-i18n="后端端口（可选）">后端端口（可选）</span><input name="port" type="number" min="1024" max="65535"></label><label><span data-i18n="持久数据路径（每行一个，相对于 Artifact 目录）">持久数据路径（每行一个，相对于 Artifact 目录）</span><textarea name="dataPaths" rows="2" placeholder="data"></textarea></label><div class="dialog-actions"><button class="primary" type="submit"><span data-i18n="注册">注册</span></button></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-head"><h2><span data-i18n="设置">设置</span></h2><button class="quiet" data-close aria-label="关闭" data-i18n-aria-label="关闭">×</button></div><div class="dialog-body"><label><span data-i18n="界面语言">界面语言</span><select data-language-picker aria-label="界面语言" data-i18n-aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select><small data-i18n="仅影响平台界面，不改变会话或 Artifact 内容。">仅影响平台界面，不改变会话或 Artifact 内容。</small></label><section class="settings-section" id="archive-list" aria-label="已归档内容" data-i18n-aria-label="已归档内容"></section><h3><span data-i18n="执行电脑">执行电脑</span></h3><section class="settings-section" id="host-list"></section><form id="host-form"><label><span data-i18n="电脑名称">电脑名称</span><input name="name" required placeholder="Mac mini"></label><label><span data-i18n="平台地址">平台地址</span><input name="url" type="url" required placeholder="http://mac-mini:4174"></label><label><span data-i18n="该电脑的连接令牌">该电脑的连接令牌</span><input name="token" type="password" autocomplete="off"><small><span data-i18n="保存在当前服务电脑，不随项目同步。">保存在当前服务电脑，不随项目同步。</span></small></label><div class="dialog-actions"><button class="primary" type="submit"><span data-i18n="连接电脑">连接电脑</span></button></div></form></div></dialog>
<dialog id="auth-dialog"><div class="dialog-head"><h2><span data-i18n="连接 Studiolo">连接 Studiolo</span></h2></div><form id="auth-form" class="dialog-body"><label><span data-i18n="服务访问令牌">服务访问令牌</span><input id="auth-token" type="password" required autocomplete="current-password"></label><p id="auth-error" class="auth-error"></p><div class="dialog-actions"><button type="submit" class="primary"><span data-i18n="连接">连接</span></button></div></form></dialog>
<dialog id="rename-dialog"><div class="dialog-head"><h2 data-i18n="重命名对话">重命名对话</h2><button class="quiet" data-close aria-label="关闭" data-i18n-aria-label="关闭">×</button></div><form id="rename-form" class="dialog-body"><label><span data-i18n="对话标题">对话标题</span><input id="rename-title" name="title" required maxlength="120" autocomplete="off" autofocus></label><p id="rename-error" class="auth-error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet" data-close data-i18n="取消">取消</button><button id="rename-save" type="submit" class="primary" data-i18n="保存名称">保存名称</button></div></form></dialog>
<dialog id="lifecycle-dialog" aria-labelledby="lifecycle-title" aria-describedby="lifecycle-name lifecycle-description"><div class="dialog-head"><h2 id="lifecycle-title"></h2><button type="button" class="quiet" data-close aria-label="关闭" data-i18n-aria-label="关闭">×</button></div><form method="dialog" class="dialog-body"><p id="lifecycle-name" style="overflow-wrap:anywhere;font-weight:600"></p><p id="lifecycle-description"></p><div class="dialog-actions"><button id="lifecycle-cancel" type="submit" value="cancel" class="quiet" autofocus data-i18n="取消">取消</button><button id="lifecycle-confirm" type="submit" value="confirm" class="primary"></button></div></form></dialog>
</body></html>
