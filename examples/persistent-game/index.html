<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点击目标</title><style>body{margin:0;padding:32px;background:#0b120e;color:#e4eedc;font:16px system-ui}main{max-width:760px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}button{padding:10px 20px;background:#bded8d;border:0;cursor:pointer;font:inherit}canvas{display:block;width:100%;margin:24px 0;border:1px solid #41513c;background:#111c15;touch-action:none}li{padding:5px}#status{color:#b0bcaa;font-size:13px}</style><main><header><h1 id="game-title">点击目标</h1><button id="start">开始 15 秒</button></header><p>得分 <strong id="score">0</strong> · 剩余 <span id="remaining">15</span> 秒</p><canvas id="game" width="720" height="360" aria-label="点击绿色目标获得分数"></canvas><h2>最高分</h2><ol id="scores"></ol><p id="status"></p></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let score=0,remaining=15,timer,x=120,y=140;function draw(){ctx.clearRect(0,0,720,360);ctx.fillStyle='#b9ec8d';ctx.beginPath();ctx.arc(x,y,25,0,2*Math.PI);ctx.fill();}draw();async function scores(){const data=await(await fetch('api/scores')).json();document.querySelector('#scores').replaceChildren(...data.map(row=>{const li=document.createElement('li');li.textContent=row.score+' 分 · '+new Date(row.created_at).toLocaleString();return li;}));}scores().catch(e=>document.querySelector('#status').textContent=e.message);document.querySelector('#start').onclick=()=>{clearInterval(timer);score=0;remaining=15;document.querySelector('#score').textContent=0;document.querySelector('#start').disabled=true;timer=setInterval(async()=>{remaining--;document.querySelector('#remaining').textContent=remaining;if(remaining===0){clearInterval(timer);timer=null;document.querySelector('#start').disabled=false;try{await fetch('api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score})});await scores();document.querySelector('#status').textContent='已保存到项目数据库';}catch(e){document.querySelector('#status').textContent='保存失败：'+e.message;}}},1000);};canvas.onclick=e=>{if(!timer)return;const r=canvas.getBoundingClientRect(),px=(e.clientX-r.left)*720/r.width,py=(e.clientY-r.top)*360/r.height;if(Math.hypot(px-x,py-y)<30){document.querySelector('#score').textContent=++score;x=30+Math.random()*660;y=30+Math.random()*300;draw();}};
</script></html>
