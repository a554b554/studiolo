<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas 目标游戏</title><link rel="stylesheet" href="../assets/style.css"></head><body><main><header><div><div class="eyebrow">Canvas Playground</div><h1 id="canvas-title">追踪绿色目标</h1><p class="muted">点击圆形，每次命中获得一分。</p></div><button id="reset">重新开始</button></header><section class="card"><div class="row"><span>当前得分</span><strong id="score" class="stat">0</strong></div><canvas id="game-canvas" width="800" height="420" aria-label="绿色目标游戏"></canvas><p id="canvas-hint">目标位置会在命中后改变。</p></section></main><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let points=0,x=160,y=180;function paint(){ctx.clearRect(0,0,800,420);ctx.strokeStyle='#294c3c';for(let i=0;i<800;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,420);ctx.stroke()}for(let i=0;i<420;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(800,i);ctx.stroke()}ctx.fillStyle='#b9ed8d';ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18382c';ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText('+1',x,y+6)}paint();canvas.onclick=e=>{const r=canvas.getBoundingClientRect();if(Math.hypot((e.clientX-r.x)*800/r.width-x,(e.clientY-r.y)*420/r.height-y)<34){document.querySelector('#score').textContent=++points;x=(x+197)%640+70;y=(y+91)%270+60;paint()}};document.querySelector('#reset').onclick=()=>{points=0;x=160;y=180;document.querySelector('#score').textContent=0;paint()};</script></body></html>
