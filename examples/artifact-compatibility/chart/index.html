<!doctype html><HTML lang="zh-CN"><HEAD><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG 数据图表</title><link rel="stylesheet" href="/assets/style.css"></HEAD><body><main><header><div><div class="eyebrow">Reading Activity</div><h1 id="chart-title">一周阅读记录</h1></div><button id="chart-update">切换数据</button></header><section class="grid"><div class="card"><span class="muted">本周总时间</span><div id="total" class="stat">175 分钟</div></div><div class="card"><span class="muted">最长一次</span><div id="maximum" class="stat">45 分钟</div></div></section><section class="card"><svg id="reading-chart" viewBox="0 0 700 340" role="img" aria-label="周一到周五的阅读时长"><g stroke="#d3dbd0"><path d="M50 280H660M50 200H660M50 120H660M50 40H660"/></g><g fill="#758176" font-size="13"><text x="16" y="284">0</text><text x="8" y="204">20</text><text x="8" y="124">40</text><text x="8" y="44">60</text></g><g id="bars" fill="#35715a"><rect id="bar-mon" x="80" y="160" width="72" height="120" rx="6"/><rect id="bar-tue" x="194" y="120" width="72" height="160" rx="6"/><rect id="bar-wed" x="308" y="180" width="72" height="100" rx="6"/><rect id="bar-thu" x="422" y="100" width="72" height="180" rx="6"/><rect id="bar-fri" x="536" y="140" width="72" height="140" rx="6"/></g><g fill="#20352c" font-size="14" text-anchor="middle"><text x="116" y="310">周一</text><text x="230" y="310">周二</text><text x="344" y="310">周三</text><text x="458" y="310">周四</text><text x="572" y="310">周五</text></g></svg><output id="chart-selection">点击柱形查看时长</output></section></main><script>let alt=false;const sets=[[30,40,25,45,35],[45,20,55,35,50]];document.querySelector('#chart-update').onclick=()=>{alt=!alt;const values=sets[+alt];document.querySelectorAll('#bars rect').forEach((el,i)=>{el.setAttribute('y',280-values[i]*4);el.setAttribute('height',values[i]*4)});document.querySelector('#total').textContent=values.reduce((a,b)=>a+b,0)+' 分钟';document.querySelector('#maximum').textContent=Math.max(...values)+' 分钟'};document.querySelectorAll('#bars rect').forEach((el,i)=>el.onclick=()=>document.querySelector('#chart-selection').textContent='周'+['一','二','三','四','五'][i]+'：'+sets[+alt][i]+' 分钟');</script></body></HTML>
