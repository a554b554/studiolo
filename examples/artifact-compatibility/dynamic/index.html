<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态页面与组件</title><link rel="stylesheet" href="/assets/style.css"><style>button{padding:18px 32px!important;border-radius:30px!important;font-size:18px!important;box-shadow:4px 4px 0 #172d23!important}button::before{content:'↗ ';}*{scroll-margin-top:24px}.card{scroll-margin-top:24px}</style></head><body><main><div class="eyebrow">Project Journal</div><h1 id="dynamic-title">正在发生的事情</h1><nav><a href="/dynamic/index.html" id="overview-link">概览</a><a href="/dynamic/notes" id="notes-link">笔记</a></nav><section id="view" class="card"></section><section class="card"><h2>独立计数组件</h2><counter-card id="counter-widget"></counter-card></section><section class="card"><h2>动态内容</h2><button id="add-note">新增一条笔记</button><div id="notes"></div></section></main><script type="module">class CounterCard extends HTMLElement{constructor(){super();const root=this.attachShadow({mode:'open'});root.innerHTML='<style>:host{display:block}button{font:14px system-ui;background:#e6eddd;border:1px solid #abc499;padding:12px;color:#244433;border-radius:4px}</style><p id="component-label">组件内的阅读次数</p><button id="increment">已读 0 次</button>';let n=0;root.querySelector('button').onclick=e=>e.target.textContent='已读 '+(++n)+' 次'}}customElements.define('counter-card',CounterCard);const view=document.querySelector('#view');function render(){view.innerHTML=location.pathname.endsWith('/notes')?'<h2 id="view-title">笔记视图</h2><p id="view-copy">为下一次阅读留下一条线索。</p>':'<h2 id="view-title">项目概览</h2><p id="view-copy">页面更新后，稳定标记仍然可以帮助找到原位置。</p>'}addEventListener('popstate',render);document.querySelectorAll('nav a').forEach(link=>link.onclick=e=>{e.preventDefault();history.pushState({},'',link.getAttribute('href'));render()});render();let n=0;document.querySelector('#add-note').onclick=()=>{const p=document.createElement('p');p.id='note-'+(++n);p.textContent='新笔记 '+n+'：继续阅读，继续修改。';document.querySelector('#notes').append(p)};</script></body></html>
